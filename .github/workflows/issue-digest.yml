name: Daily issue digest

# Summarizes user reports filed from figg's Report a Bug window. It only
# writes a summary comment; it never edits code, opens PRs, or changes issues.
# Docs: .github/issue-digest/README.md
#
# Anyone on GitHub can file a report, so issue text is hostile input. The work
# is split in two jobs so that text never meets a token that can write:
#   write  reads the issues and asks the model for text. Read-only token. The
#          model has no tools and sees no files.
#   post   publishes the text. It holds the write token and the Slack secret,
#          runs no model, and treats the digest as plain text.

on:
  schedule:
    # 13:00 UTC daily.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Look-back window in hours"
        required: false
        default: "24"
      post:
        description: "Post to the digest issue (false = dry run to step summary only)"
        required: false
        default: "true"

permissions: {}

concurrency:
  group: issue-digest
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}
  HOURS: ${{ github.event.inputs.hours || vars.DIGEST_HOURS || '24' }}

jobs:
  write:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    env:
      DIGEST_MODEL: ${{ vars.DIGEST_MODEL || 'claude-sonnet-5-5' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect user reports
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/collect-issues.sh

      - name: Write digest with Claude
        if: steps.collect.outputs.total != '0'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash .github/scripts/write-digest.sh

      - name: Fallback digest when the model step produced nothing
        if: always()
        run: bash .github/scripts/collect-issues.sh --fallback-digest

      - name: Hand the digest to the post job
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: issue-digest-${{ github.run_id }}
          path: digest/DIGEST.md
          retention-days: 30
          if-no-files-found: ignore

  post:
    needs: write
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      POST: ${{ github.event.inputs.post || 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: issue-digest-${{ github.run_id }}
          path: digest

      - name: Ensure labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/ensure-labels.sh

      - name: Post digest
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.DIGEST_SLACK_WEBHOOK_URL }}
        run: bash .github/scripts/post-digest.sh
