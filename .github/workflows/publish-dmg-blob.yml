# Republishes an existing release's dmg to the figg-downloads Vercel Blob
# store, so the website serves it and the in-app updater offers it. The
# release workflow does this itself on every release; run this one by hand
# when that step failed or the secret was added after the release was cut:
#
#   gh workflow run publish-dmg-blob.yml -f tag=v0.2.0
#
# It uploads the dmg already attached to the GitHub release. Nothing is
# rebuilt. Both figg.dmg and latest.json end up naming the tag given, so
# after republishing an old tag, republish the newest one too.
name: publish dmg to blob

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v0.2.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Never interpolate the input into a script; read it from the environment.
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check the tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must look like v1.2.3"; exit 1; }
          echo "FIGG_VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Download the dmg from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --pattern "figg-$FIGG_VERSION.dmg" --dir build

      - name: Publish DMG to Vercel Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          npm ci --prefix scripts --ignore-scripts
          node scripts/publish-dmg-blob.mjs "build/figg-$FIGG_VERSION.dmg" "$FIGG_VERSION"
